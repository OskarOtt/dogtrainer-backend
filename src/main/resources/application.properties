spring.application.name=dogtrainer-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA / Hibernate — Liquibase owns the schema, Hibernate must never generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# External identity providers
app.auth.apple.audiences=${APPLE_CLIENT_IDS:}
app.auth.apple.client-id=${APPLE_CLIENT_ID:}
app.auth.apple.team-id=${APPLE_TEAM_ID:}
app.auth.apple.key-id=${APPLE_KEY_ID:}
app.auth.apple.private-key=${APPLE_PRIVATE_KEY:}
app.auth.reauthentication-max-age-seconds=${AUTH_REAUTH_MAX_AGE_SECONDS:300}

# Cloudflare R2 object storage
app.r2.endpoint=${R2_ENDPOINT}
app.r2.access-key=${R2_ACCESS_KEY}
app.r2.secret-key=${R2_SECRET_KEY}
app.r2.bucket=${R2_BUCKET}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL}
app.r2.presign-expiry-seconds=${R2_PRESIGN_EXPIRY_SECONDS:600}
