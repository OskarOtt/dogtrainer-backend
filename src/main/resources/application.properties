spring.application.name=dogtrainer-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA / Hibernate — Liquibase owns the schema, Hibernate must never generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

