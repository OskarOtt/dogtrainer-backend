# Production profile — PostgreSQL. Replace the dummy values below (or override via env vars) for your environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dogtrainer}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:dogtrainer}
spring.datasource.password=${DB_PASSWORD:dogtrainer}

spring.liquibase.enabled=true

logging.level.com.oskott.dogtrainerbackend=INFO
